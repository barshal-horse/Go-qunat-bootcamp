name: GoDark Quant Agent (Bootcamp)

on:
  schedule:
    - cron: '20 0,6,12,18 * * *'  # Autoruns at 00:20, 06:20, 12:20, 18:20 UTC (3m after 340m run concludes)
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: quant-agent-singleton
  cancel-in-progress: true

jobs:
  run-agent:
    runs-on: ubuntu-latest
    timeout-minutes: 350

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - uses: actions/cache@v4
        with:
          path: .venv
          key: venv-${{ runner.os }}-${{ hashFiles('requirements.txt') }}

      - name: Install deps
        run: |
          python -m venv .venv
          .venv/bin/pip install --upgrade pip
          .venv/bin/pip install -r requirements.txt
          .venv/bin/pip install "git+https://github.com/gq-godark/gdx-python-sdk-examples.git#subdirectory=sdk"

      - name: Run Agent
        env:
          GODARK_API_KEY_ID: ${{ secrets.GODARK_API_KEY_ID }}
          GODARK_API_SECRET: ${{ secrets.GODARK_API_SECRET }}
          GODARK_PASSPHRASE: ${{ secrets.GODARK_PASSPHRASE }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          PYTHONUNBUFFERED: "1"
        run: |
          set -e
          timeout 340m .venv/bin/python examples/quantitative_trading_agent.py || [ $? -eq 124 ]

      - name: Upload trade logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trades-${{ github.run_id }}
          path: trades.log
          retention-days: 90