[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "godark"
version = "0.2.0"
description = "GoDark Python Trading SDK"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "websockets>=16.0",
    "httpx>=0.27",
    "pydantic>=2.0",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["godark*"]